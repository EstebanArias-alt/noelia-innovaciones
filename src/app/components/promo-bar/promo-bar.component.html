@let mensajes = [
  '✨ 12 cuotas sin interés',
  '🚚 Consultá por envíos',
  '🛋 Diseños exclusivos',
  '💬 Atención por WhatsApp'
];

<div class="promo-bar">
  <div class="promo-track">
    @for (grupo of [0, 1]; track grupo) {
      <div class="promo-grupo" [attr.aria-hidden]="grupo === 1 ? 'true' : null">
        @for (mensaje of mensajes; track mensaje) {
          <span>{{ mensaje }}</span>
        }
        @for (mensaje of mensajes; track mensaje) {
          <span class="promo-repetido" aria-hidden="true">{{ mensaje }}</span>
        }
      </div>
    }
  </div>
</div>
