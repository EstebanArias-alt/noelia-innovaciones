<section
  class="contacto"
  id="contacto"
>

  <div class="contacto-container">

    <div class="contacto-info">

      <span>
        CONTACTO
      </span>

      <h2>
        Estamos para ayudarte
      </h2>

      <p>
        ¿Querés consultar por un producto, medidas,
        colores o disponibilidad? Escribinos y te
        asesoramos personalmente.
      </p>

      <div class="contacto-items">

        <a
          href="https://wa.me/549XXXXXXXXXX"
          target="_blank"
          class="contacto-item"
        >
          <div class="icono">
            W
          </div>

          <div>
            <small>WHATSAPP</small>
            <strong>
              Consultar ahora
            </strong>
          </div>
        </a>


        <a
          href="#"
          target="_blank"
          class="contacto-item"
        >
          <div class="icono">
            IG
          </div>

          <div>
            <small>INSTAGRAM</small>
            <strong>
              Seguinos
            </strong>
          </div>
        </a>


        <a
          href="#"
          target="_blank"
          class="contacto-item"
        >
          <div class="icono">
            F
          </div>

          <div>
            <small>FACEBOOK</small>
            <strong>
              Noelia Innovaciones
            </strong>
          </div>
        </a>

      </div>

    </div>


    <div class="contacto-form">

      <h3>
        Dejanos tu consulta
      </h3>

      <div class="form-group">

        <label for="nombre">
          Nombre
        </label>

        <input
          type="text"
          id="nombre"
          placeholder="Tu nombre"
        >

      </div>


      <div class="form-group">

        <label for="telefono">
          Teléfono
        </label>

        <input
          type="tel"
          id="telefono"
          placeholder="Tu número de teléfono"
        >

      </div>


      <div class="form-group">

        <label for="mensaje">
          Consulta
        </label>

        <textarea
          id="mensaje"
          rows="5"
          placeholder="¿En qué podemos ayudarte?"
        ></textarea>

      </div>


      <button type="button">
        Enviar consulta
      </button>

    </div>

  </div>

</section>
